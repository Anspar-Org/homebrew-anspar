name: Build Bottles

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  build-bottle:
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'pr-pull') &&
      startsWith(github.event.pull_request.title, 'Update ')
    strategy:
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v5
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Ensure rustup is in PATH
        run: |
          # macOS runners have rustup pre-installed; add it to PATH so Homebrew
          # skips building its own rust formula (~2.2GB of deps)
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - name: Extract package and version from PR title
        id: pr-info
        run: |
          # PR title format: "Update <package> to <version>"
          TITLE="${{ github.event.pull_request.title }}"
          PACKAGE=$(echo "$TITLE" | sed -n 's/^Update \(.*\) to .*/\1/p')
          VERSION=$(echo "$TITLE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "package=${PACKAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected: ${PACKAGE} v${VERSION}"

      - name: Build bottle
        run: |
          brew test-bot --only-formulae --only-json-tab \
            --tap="${{ github.repository_owner }}/anspar" \
            --root-url="https://github.com/${{ github.repository }}/releases/download/${{ steps.pr-info.outputs.package }}-${{ steps.pr-info.outputs.version }}"

      - name: Upload bottles as artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bottles-${{ matrix.os }}
          path: '*.bottle.*'
          if-no-files-found: error

  auto-publish:
    needs: build-bottle
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add pr-pull label to trigger publish
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --add-label "pr-pull"

  notify-failure:
    name: Notify Build Failure
    needs: build-bottle
    if: always() && needs.build-bottle.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      # Required for slack-notify (reads .github/slack-channels.yml).
      - uses: actions/checkout@v5

      - name: Resolve package, version and release author
        id: pr-info
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          PR_OPENER: ${{ github.event.pull_request.user.login }}
        run: |
          PACKAGE=$(printf '%s' "$TITLE" | sed -n 's/^Update \(.*\) to .*/\1/p')
          VERSION=$(printf '%s' "$TITLE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          # The release that dispatched this update records who cut it in the
          # PR body. The PR itself is always opened by the tap token's owner,
          # who is not necessarily that person, so only fall back to them.
          AUTHOR=$(printf '%s' "$BODY" | sed -n 's/.*(author: \([^)]*\)).*/\1/p' | head -1)
          if [ -z "$AUTHOR" ] || [ "$AUTHOR" = "unknown" ]; then
            AUTHOR="$PR_OPENER"
          fi
          echo "package=${PACKAGE:-unknown}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION:-unknown}" >> "$GITHUB_OUTPUT"
          echo "author=${AUTHOR}" >> "$GITHUB_OUTPUT"

      - name: Build failure message
        id: message
        env:
          PACKAGE: ${{ steps.pr-info.outputs.package }}
          VERSION: ${{ steps.pr-info.outputs.version }}
          AUTHOR: ${{ steps.pr-info.outputs.author }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG=$(printf '%s\n\n%s\n%s\n%s' \
            ":rotating_light: *Homebrew bottle build failed* for ${PACKAGE} v${VERSION}" \
            "The release is on PyPI but the tap is still on the previous version." \
            "*PR:* <${PR_URL}|#${PR_NUMBER}> (released by ${AUTHOR})" \
            "*Run:* <${RUN_URL}|View failed run>")
          {
            echo "text<<EOF"
            echo "$MSG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The DM below depends on the author having a public email and a
      # matching Slack account; the channel post does not, so a tap failure
      # stays visible even when the lookup comes up empty.
      - name: Post failure to channel
        uses: Cure-HHT/hht_workflows/.github/actions/slack-notify@bfe3d57b66429f300d11496b541c91d2934ceada
        with:
          event: bottle-build-failure
          text: ${{ steps.message.outputs.text }}
          slack-token: ${{ secrets.SLACK_APP_OATH_TOKEN }}

      - name: Lookup Slack user (release author) for DM
        id: slack_user
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_APP_OATH_TOKEN }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AUTHOR: ${{ steps.pr-info.outputs.author }}
        run: |
          EMAIL=$(gh api "users/${AUTHOR}" --jq '.email // empty') || EMAIL=""

          if [ -z "$EMAIL" ] || echo "$EMAIL" | grep -q 'noreply'; then
            echo "::warning::No usable email for release author ${AUTHOR}; failure DM not sent"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SLACK_RESPONSE=$(curl -s -H "Authorization: Bearer ${SLACK_TOKEN}" \
            "https://slack.com/api/users.lookupByEmail?email=${EMAIL}")

          if [ "$(echo "$SLACK_RESPONSE" | jq -r '.ok')" = "true" ]; then
            echo "user_id=$(echo "$SLACK_RESPONSE" | jq -r '.user.id')" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            ERR=$(echo "$SLACK_RESPONSE" | jq -r '.error // "unknown"')
            echo "::warning::Slack user lookup failed for ${EMAIL}: ${ERR}; failure DM not sent"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # DMs target a user ID, not a channel name — the shared
      # slack-notify action only routes named channels, so failure DMs
      # stay on slackapi/slack-github-action.
      - name: Send failure DM
        if: steps.slack_user.outputs.found == 'true'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_APP_OATH_TOKEN }}
          errors: true
          payload: |
            channel: "${{ steps.slack_user.outputs.user_id }}"
            text: ${{ toJSON(steps.message.outputs.text) }}
